<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Table Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-6 font-sans text-gray-800">

    <div class="max-w-5xl mx-auto">
        <div id="tableContainer">
            <div class="table-wrapper space-y-3 bg-white text-gray-800">
                <div
                    class="table-toolbar flex justify-between items-center bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                    <div class="flex items-center space-x-2"><span class="text-sm font-semibold text-gray-700">Data
                            Items</span></div>
                    <div class="relative flex items-center"><span
                            class="absolute left-2.5 text-gray-400 pointer-events-none text-sm">🔍</span><input
                            type="text" id="tableSearchInput" placeholder="Search items..."
                            class="border border-gray-300 rounded pl-8 pr-3 py-1.5 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-gray-800 placeholder-gray-400">
                    </div>
                </div>
                <table
                    class="w-full border-collapse border border-gray-300 shadow-sm rounded-lg overflow-hidden bg-white">
                    <thead class="bg-gray-100 border-b border-gray-300">
                        <tr
                            class="text-left text-xs font-semibold text-gray-600 uppercase tracking-wider hover:bg-gray-50 transition-colors">
                            <th class="px-4 py-3 border-r border-gray-200 w-12">StockItemName</th>
                            <th class="px-4 py-3 border-r border-gray-200 w-12">StockParentName</th>
                            <th class="px-4 py-3 border-r border-gray-200 w-12">Credit</th>
                            <th class="px-4 py-3 border-r border-gray-200 w-12">Debit</th>
                        </tr>
                    </thead>
                    <tbody slot="body" class="divide-y divide-gray-200 text-sm text-gray-800">
                        <tr
                            class="text-left text-xs font-semibold text-gray-600 uppercase tracking-wider hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3 border-r border-gray-200">0.09/30mm</td>
                            <td class="px-4 py-3 border-r border-gray-200">FISH KNITTED FABRIC</td>
                            <td class="px-4 py-3 border-r border-gray-200">500</td>
                            <td class="px-4 py-3 border-r border-gray-200"></td>
                        </tr>
                        <tr
                            class="text-left text-xs font-semibold text-gray-600 uppercase tracking-wider hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3 border-r border-gray-200">0.11-25</td>
                            <td class="px-4 py-3 border-r border-gray-200">FISH KNITTED FABRIC</td>
                            <td class="px-4 py-3 border-r border-gray-200"></td>
                            <td class="px-4 py-3 border-r border-gray-200">250</td>
                        </tr>
                        <tr
                            class="text-left text-xs font-semibold text-gray-600 uppercase tracking-wider hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3 border-r border-gray-200">0.11-30</td>
                            <td class="px-4 py-3 border-r border-gray-200">FISH KNITTED FABRIC</td>
                            <td class="px-4 py-3 border-r border-gray-200"></td>
                            <td class="px-4 py-3 border-r border-gray-200">150</td>
                        </tr>
                        <tr
                            class="text-left text-xs font-semibold text-gray-600 uppercase tracking-wider hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3 border-r border-gray-200">0.11/32mm</td>
                            <td class="px-4 py-3 border-r border-gray-200">FISH KNITTED FABRIC</td>
                            <td class="px-4 py-3 border-r border-gray-200"></td>
                            <td class="px-4 py-3 border-r border-gray-200">350</td>
                        </tr>
                        <tr
                            class="text-left text-xs font-semibold text-gray-600 uppercase tracking-wider hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3 border-r border-gray-200">0.11/35mm</td>
                            <td class="px-4 py-3 border-r border-gray-200">FISH KNITTED FABRIC</td>
                            <td class="px-4 py-3 border-r border-gray-200">450</td>
                            <td class="px-4 py-3 border-r border-gray-200"></td>
                        </tr>
                        <tr
                            class="text-left text-xs font-semibold text-gray-600 uppercase tracking-wider hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3 border-r border-gray-200">0.13/32mm</td>
                            <td class="px-4 py-3 border-r border-gray-200">FISH KNITTED FABRIC</td>
                            <td class="px-4 py-3 border-r border-gray-200">200</td>
                            <td class="px-4 py-3 border-r border-gray-200"></td>
                        </tr>
                        <tr
                            class="text-left text-xs font-semibold text-gray-600 uppercase tracking-wider hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3 border-r border-gray-200">0.14/30mm</td>
                            <td class="px-4 py-3 border-r border-gray-200">COTTON FABRIC</td>
                            <td class="px-4 py-3 border-r border-gray-200"></td>
                            <td class="px-4 py-3 border-r border-gray-200">100</td>
                        </tr>
                    </tbody>
                    <tfoot class="bg-gray-100 border-b border-gray-300">
                        <tr class="text-left text-xs font-semibold text-gray-600 uppercase tracking-wider hover:bg-gray-50 transition-colors">
                            <th class="px-4 py-3 border-r border-gray-200 w-12">
                                <input type="text" name="StockItemName" placeholder="StockItemName" class="w-full border border-gray-300 rounded px-2.5 py-1.5 text-xs bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-300 focus:ring-offset-2 focus:shadow-lg transition-all duration-150">
                            </th>
                            <th class="px-4 py-3 border-r border-gray-200 w-12">
                                <input type="text" name="StockParentName" placeholder="StockParentName" class="w-full border border-gray-300 rounded px-2.5 py-1.5 text-xs bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-300 focus:ring-offset-2 focus:ring-offset-blue-100 focus:shadow-xl transition-all duration-150">
                            </th>
                            <th class="px-4 py-3 border-r border-gray-200 w-12">
                                <input type="text" name="Credit" placeholder="Credit" class="w-full border border-gray-300 rounded px-2.5 py-1.5 text-xs bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-300 focus:ring-offset-2 focus:shadow-lg transition-all duration-150">
                            </th>
                            <th class="px-4 py-3 border-r border-gray-200 w-12">
                                <input type="text" name="Debit" placeholder="Debit" class="w-full border border-gray-300 rounded px-2.5 py-1.5 text-xs bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 focus:ring-offset-2 focus:ring-offset-blue-300 focus:shadow-xl transition-all duration-150">
                            </th>
                        </tr>
                    </tfoot>


                </table>
            </div>
        </div>
    </div>
</body>

</html>
